# Vérifie le site à chaque proposition de modification (pull request), et le vérifie puis le publie
# sur GitHub Pages à chaque envoi sur la branche main (ou lancement manuel sur main).
# Une pull request ne publie jamais rien : seul le job « verifications » tourne.
# Sécurité des workflows : docs/securite/robot-dependances.md.
# Les actions sont figées par empreinte de commit (SHA) ; le commentaire donne la version,
# et Dependabot met les deux à jour (.github/dependabot.yml).
name: Déploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job demande seulement ce dont il a besoin.
permissions: {}

# Une pull request mise à jour annule sa vérification précédente (inutile de finir l'ancienne).
# Sur main, on n'interrompt jamais une exécution en cours.
concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifications:
    name: Vérifications
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts : aucun script d'installation de paquet ne s'exécute (protection contre un
      # paquet piégé). `npm run check` fait lui-même le `svelte-kit sync` du script « prepare ».
      - run: npm ci --ignore-scripts
      - name: Vérifications (types, mise en forme, lint)
        run: |
          npm run check
          npm run lint
      - name: Tests unitaires (moteur de quêtes)
        run: npm test
      - name: Audit des dépendances (bloquant si faille élevée dans ce qui est livré)
        run: node .github/scripts/audit-dependances.mjs
      - run: npm run build
      - name: Budget de poids (sobriété)
        run: npm run budget
      # Image figée (ubuntu-24.04, prise en charge par Playwright) : ubuntu-latest est passée à
      # 26.04 et ses miroirs ont fait échouer l'installation des dépendances du navigateur.
      # Trois essais, car le téléchargement des paquets système échoue parfois.
      - name: Navigateur de test
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Essai $i échoué, nouvel essai dans 30 s"; sleep 30
          done
          exit 1
      - name: Tests de bout en bout (parcours, accessibilité, hors-ligne)
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rapport-playwright
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build

  deploy:
    # Publication : envoi sur main, ou lancement manuel (onglet Actions, ou robots « Index des gares »
    # et « Dependabot : fusion automatique ») sur main. Jamais pour une pull request.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verifications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write # publier sur GitHub Pages (et annuler une publication bloquée)
      id-token: write # prouver à GitHub Pages que la publication vient de ce workflow
      deployments: read # lister les publications précédentes
    # Une publication à la fois, sans interrompre celle en cours : interrompre une publication
    # GitHub Pages peut la laisser bloquée « en cours » et faire échouer les suivantes.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Si une publication précédente est restée bloquée « en cours » chez GitHub Pages,
      # on l'annule avant de publier (sinon GitHub refuse la nouvelle publication).
      - name: Débloquer une publication précédente
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=5" --jq '.[].sha'); do
            [ "$sha" = "$SHA" ] && continue
            status=$(gh api "repos/$REPO/pages/deployments/$sha" --jq '.status' 2>/dev/null || true)
            case "$status" in
              deployment_queued|deployment_in_progress|syncing_files|updating_pages|deployment_cancelled_pending)
                echo "Annulation de la publication bloquée $sha ($status)"
                gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" || true ;;
            esac
          done
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # GitHub Pages est parfois lent : 20 minutes au lieu de 10.
          timeout: 1200000
