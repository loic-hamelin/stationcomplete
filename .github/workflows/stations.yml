# Régénère chaque semaine l'index des gares de chaque pays activé (static/data/stations-<cc>.json)
# depuis l'extrait OpenStreetMap Geofabrik du pays, puis relance la publication du site.
# Pays, extraits et fichiers : configuration des pays (src/lib/core/countries.ts).
# Un pays en échec n'empêche pas les autres d'être mis à jour.
# Lancement manuel possible (onglet Actions), avec en option le téléchargement des gares de référence.
name: Index des gares

on:
  schedule:
    - cron: '17 3 * * 1' # lundi 3 h 17 UTC
  workflow_dispatch:
    inputs:
      fixtures:
        description: 'Télécharger aussi les gares de référence (tests)'
        type: boolean
        default: false
      pays:
        description: 'Seulement ces pays (codes séparés par des espaces, même désactivés ; vide = pays activés)'
        type: string
        default: ''

# Aucun droit par défaut : chaque job demande seulement ce dont il a besoin.
permissions: {}

concurrency:
  group: stations
  cancel-in-progress: false

jobs:
  pays:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.liste.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pays à construire
        id: liste
        env:
          PAYS: ${{ inputs.pays }}
        run: |
          node scripts/countries.mjs check
          # Codes séparés par des espaces : découpage voulu ($PAYS sans guillemets, sans jokers).
          set -f
          echo "matrix=$(node scripts/countries.mjs matrix $PAYS)" >> "$GITHUB_OUTPUT"

  index:
    needs: pays
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pays: ${{ fromJSON(needs.pays.outputs.matrix) }}
    name: Index ${{ matrix.pays.code }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.pays.code }}
      GEOFABRIK: ${{ matrix.pays.geofabrik }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Outil osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Extrait du pays (Geofabrik)
        run: |
          curl -fsSL -A "stationcomplete-stations (+https://stationcomplete.org)" \
            -o "pays-$CC.osm.pbf" "https://download.geofabrik.de/$GEOFABRIK-latest.osm.pbf"
          ls -lh "pays-$CC.osm.pbf"
      - name: Filtrage ferroviaire et export
        run: |
          osmium tags-filter "pays-$CC.osm.pbf" \
            nwr/railway=station,halt,platform n/railway=signal nwr/public_transport=platform \
            -o "rail-$CC.osm.pbf"
          # Jauges (quais, voies, pancartes) : quais, voies et signaux, avec les coordonnées des
          # nœuds dans les ways (OPL), lus par le moteur de quêtes de l'appli (architecture § 13.6).
          osmium tags-filter "pays-$CC.osm.pbf" \
            nwr/railway=platform nwr/public_transport=platform w/railway=rail n/railway=signal \
            -o "jauges-$CC.osm.pbf"
          rm "pays-$CC.osm.pbf"
          osmium export "rail-$CC.osm.pbf" -f geojsonseq --add-unique-id=type_id -o "rail-$CC.geojsonseq"
          osmium add-locations-to-ways "jauges-$CC.osm.pbf" -f opl -o "jauges-$CC.opl"
          ls -lh "rail-$CC.osm.pbf" "rail-$CC.geojsonseq" "jauges-$CC.osm.pbf" "jauges-$CC.opl"
      - name: Construction de l'index
        run: node scripts/build-stations.mjs "rail-$CC.geojsonseq" --country "$CC" --osm "jauges-$CC.opl"
      - name: Taille de l'index
        env:
          FICHIER: ${{ matrix.pays.file }}
        run: |
          echo "brut : $(stat -c %s "$FICHIER") octets"
          echo "gzip : $(gzip -9 -c "$FICHIER" | wc -c) octets"
      # Les fichiers gardent leur chemin dans le dépôt (racine commune : le dépôt).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.pays.code }}
          path: |
            ${{ matrix.pays.file }}
            ${{ matrix.pays.cache }}
            ${{ matrix.pays.stats }}
          if-no-files-found: error
          retention-days: 7

  publication:
    needs: [pays, index]
    # Même si un pays a échoué : les index réussis sont enregistrés.
    if: ${{ !cancelled() && needs.pays.result == 'success' }}
    runs-on: ubuntu-latest
    # Écrit l'index dans le dépôt (git push) et relance la publication (gh workflow run).
    permissions:
      contents: write # git push de l'index
      actions: write # gh workflow run deploy.yml
    steps:
      # Identifiants gardés (persist-credentials par défaut) : ce job pousse le commit de l'index.
      # Aucun artefact n'est envoyé depuis ce job : pas de fuite possible du jeton par ce biais.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Index construits
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: index-*
          merge-multiple: true
          path: .
      - name: Gares de référence
        if: inputs.fixtures
        run: node scripts/fetch-fixtures.mjs
      - name: Enregistrement
        run: |
          git config user.name "stationcomplete-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data data tests/fixtures 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "Index des gares : mise à jour du $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_ENV"
          fi
      - name: Relancer la publication
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
